
name: OpenStreetMap MCP Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osm-mcp-server
  cancel-in-progress: true

jobs:
  run-mcp:
    name: Start OSM MCP and Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MCP_TRANSPORT_TYPE: http
      MCP_HTTP_PORT: "3010"
      MCP_SESSION_MODE: stateless
      MCP_AUTH_MODE: none
      MCP_LOG_LEVEL: info
      OSM_USER_AGENT: osm-mcp-github-actions/1.0

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout actual OpenStreetMap MCP source
        uses: actions/checkout@v4
        with:
          repository: cyanheads/openstreetmap-mcp-server
          ref: main
          path: osm-server

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify source files
        run: |
          test -f osm-server/package.json
          test -f osm-server/bun.lock
          echo "Source repository verified."
          echo "Package:"
          grep '"name"' osm-server/package.json | head -1

      - name: Install dependencies
        working-directory: osm-server
        run: bun install --frozen-lockfile

      - name: Build MCP server
        working-directory: osm-server
        run: bun run rebuild

      - name: Start MCP and Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          cd osm-server

          echo "Starting OpenStreetMap MCP..."

          nohup bun run start:http > ../server.log 2>&1 &
          SERVER_PID=$!

          echo "$SERVER_PID" > ../server.pid

          READY=false

          for i in $(seq 1 60); do
            CODE=$(curl -sS --max-time 3 \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:3010/mcp || true)

            if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
              READY=true
              echo "MCP HTTP endpoint responded: $CODE"
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "MCP server exited unexpectedly."
              cat ../server.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "MCP startup timeout."
            cat ../server.log
            exit 1
          fi

          cd ..

          echo "Installing cloudflared..."

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          echo "Starting Cloudflare Quick Tunnel..."

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:3010 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > tunnel.pid

          MCP_URL=""

          for i in $(seq 1 90); do
            MCP_URL=$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflared.log | head -1 || true)

            if [ -n "$MCP_URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Cloudflare tunnel stopped."
              cat cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$MCP_URL" ]; then
            echo "Could not obtain Cloudflare URL."
            cat cloudflared.log
            exit 1
          fi

          FULL_URL="${MCP_URL}/mcp"

          echo ""
          echo "=================================="
          echo " OPENSTREETMAP MCP READY"
          echo "=================================="
          echo "MCP URL: $FULL_URL"
          echo ""

          {
            echo "# OpenStreetMap MCP Server"
            echo ""
            echo "Status: Running"
            echo ""
            echo "MCP URL: \`$FULL_URL\`"
            echo ""
            echo "Transport: Streamable HTTP"
            echo ""
            echo "Port: 3010"
            echo ""
            echo "Authentication: None"
          } >> "$GITHUB_STEP_SUMMARY"

          while true; do
            sleep 30

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "MCP server stopped."
              cat server.log
              exit 1
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Cloudflare tunnel stopped."
              cat cloudflared.log
              exit 1
            fi
          done

      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-mcp-diagnostics
          path: |
            server.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 3
